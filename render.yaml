# Veyra 8.17.2
services:
  - type: web
    name: VeyraServer
    runtime: node
    plan: pro
    buildCommand: npm install && npx playwright install chromium && node scripts/install-wireproxy.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: VEYRA_FRONTEND_URL
        value: https://homekidchud.github.io/VeyraBrowser/
      - key: PLATFORM_URL
        value: https://homekidchud.github.io/VeyraBrowser/dev/platform
      # Configure these secrets in the Render dashboard, never in Git.
      - key: RESEND_API_KEY
        sync: false
      - key: PLATFORM_EMAIL_FROM
        sync: false
      - key: PLATFORM_EARLY_ACCESS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://homekidchud.github.io
      - key: NODE_VERSION
        value: "20"
      # Pro is sized for the real Chromium fallback and browser sessions.
      - key: BROWSER_ENABLED
        value: "true"
      - key: YT_FAST_PROXY_ONLY
        value: "false"
      - key: YT_MAX_HEIGHT
        value: "360"
      # Keep in sync with `plan:` above (npm run config -- plan <name> does both).
      # "auto" also works: Veyra detects the instance's RAM/CPU from cgroups.
      - key: VEYRA_ENV
        value: production
      # Secrets — set these in the Render dashboard, never in git:
      # VEYRA_ADMIN_TOKEN, VPN_PROFILES_JSON, VPN_WIREGUARD_CONFIG_B64
      # Optional durable MongoDB persistence/cache. Set MONGODB_URI in Render.
      - key: MONGODB_URI
        sync: false
      # 8.16: Veyra Shield level (low | medium | high | under_attack).
      - key: SHIELD_LEVEL
        value: medium
      # 8.17.2: web search is API-first so normal results do not depend on
      # search-engine HTML pages that may challenge a cloud IP.
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: WEB_SEARCH_ORDER
        value: brave,bing,duckduckgo,google
      - key: MONGODB_DB
        value: veyra
      - key: MONGODB_MAX_POOL_SIZE
        value: "2"
      - key: MONGODB_SHARED_CACHE
        value: "true"
      # Safe warm-up cap: media is never downloaded by the warm phase.
      - key: PROXY_WARM_MAX_BINARY_BYTES
        value: "786432"
           # 8.17.2 browser stability guardrails (keep browser/crawler contention bounded).
      - key: CRAWLER_PAGE_HARD_MS
        value: "5000"
      - key: PROXY_WARM_HARD_MS
        value: "3500"
      - key: BROWSER_NAVIGATION_TIMEOUT_MS
        value: "15000"
      - key: BROWSER_PAGE_TIMEOUT_MS
        value: "10000"
      - key: MAX_BROWSER_PAGES
        value: "1"
      - key: BROWSER_MAX_ACTIVE_FETCHES
        value: "4"
      - key: MONGODB_CACHE_BODY_MAX_BYTES
        value: "786432"
      # Let users complete site-owned security checks in the real Chromium fallback.
      - key: CHALLENGE_AUTO_HANDOFF
        value: "true"
      - key: BROWSER_EVICT_MIN_IDLE_MS
        value: "15000"
