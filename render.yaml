# Veyra 8.17.2
services:
  - type: web
    name: VeyraServer
    runtime: node
    plan: pro
    buildCommand: npm install && node scripts/install-wireproxy.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # ---------- Veyra Access Gate (8.21.0) ----------
      # The whole service is invite-only: everyone else sees the waitlist screen.
      # Entry is via rotating invite links (/gate/<token>) or waitlist access keys.
      - key: GATE_ENABLED
        value: "true"
      # How often the invite link rotates to a fresh random string.
      - key: GATE_ROTATE_MS
        value: "600000"
      # How long previously shared links keep working after a rotation.
      - key: GATE_GRACE_MS
        value: "1200000"
      # How long an unlocked device stays unlocked.
      - key: GATE_SESSION_TTL_MS
        value: "2592000000"
      - key: GATE_WAITLIST_OPEN
        value: "true"
      # Owner's personal never-rotating entry tokens (comma separated). Set in dashboard.
      - key: GATE_OWNER_TOKENS
        sync: false
      # ---------- Remote Chromium (8.21.0) ----------
      # Run the browser lane on an external Chromium provider instead of this
      # server: BROWSER_BACKEND=remote + BROWSER_BACKEND_URL=wss://... CDP
      # endpoint (Browserless, Browserbase, Steel, or your own Chrome host).
      # Dramatically faster and frees Render CPU/RAM for the proxy lane.
      - key: BROWSER_BACKEND
        value: "local"
      - key: BROWSER_BACKEND_URL
        sync: false
      - key: BROWSER_BACKEND_CONNECT_TIMEOUT_MS
        value: "30000"
      # Remote caps: with the browser off-server the plan limits no longer bind.
      - key: MAX_BROWSER_SESSIONS
        value: "4"
      - key: MAX_BROWSER_PAGES
        value: "8"
      - key: MAX_BROWSER_CONTEXTS
        value: "8"
      # ---------- Search: 6 providers fan out in parallel, up to 100 results ----------
      - key: VEYRA_FRONTEND_URL
        value: https://homekidchud.github.io/VeyraBrowser/
      - key: PLATFORM_URL
        value: https://homekidchud.github.io/VeyraBrowser/dev/platform
      # Configure these secrets in the Render dashboard, never in Git.
      - key: RESEND_API_KEY
        sync: false
      - key: PLATFORM_EMAIL_FROM
        sync: false
      - key: PLATFORM_EARLY_ACCESS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://homekidchud.github.io
      - key: NODE_VERSION
        value: "20"
      # Chromium is an explicit opt-in; normal acquisition is direct HTTP/search-first.
      - key: BROWSER_ENABLED
        value: "false"
      - key: VEYRA_CHROMIUM_ENABLED
        value: "false"
      - key: YT_FAST_PROXY_ONLY
        value: "false"
      # YouTube's speculative asset graph can starve foreground mobile loads.
      - key: YT_WARM_RESOURCES
        value: "false"
      - key: YT_DOCUMENT_CACHE
        value: "true"
      - key: YT_SKIP_STATIC_JS_REWRITE
        value: "true"
      # 8.28.22: sending 302s for YouTube's CDN bundles is blocked by the
      # cross-origin iframe in the fast proxy, which leaves the page on its
      # skeleton and never upgrades polymer custom elements. Serve them
      # through the proxy so they load in-frame.
      - key: YT_DIRECT_STATIC_ASSETS
        value: "false"
      - key: YT_MAX_HEIGHT
        value: "360"
      # Five minutes gives the mobile page enough time to initialize and
      # prevents the old two-minute hard expiry during normal browsing.
      - key: SESSION_TIME_LIMIT_MS
        value: "300000"
      # Keep in sync with `plan:` above (npm run config -- plan <name> does both).
      # "auto" also works: Veyra detects the instance's RAM/CPU from cgroups.
      - key: VEYRA_ENV
        value: production
      # Secrets — set these in the Render dashboard, never in git:
      - key: VEYRA_AUTH_SECRET
        sync: false
      - key: VEYRA_SIGNUP_KEY
        sync: false
      # VEYRA_ADMIN_TOKEN, VPN_PROFILES_JSON, VPN_WIREGUARD_CONFIG_B64
      # Optional durable MongoDB persistence/cache. Set MONGODB_URI in Render.
      - key: MONGODB_URI
        sync: false
      # 8.16: Veyra Shield level (low | medium | high | under_attack).
      - key: SHIELD_LEVEL
        value: medium
      # 8.17.2: web search is API-first so normal results do not depend on
      # search-engine HTML pages that may challenge a cloud IP.
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: WEB_SEARCH_ORDER
        value: brave,bing,duckduckgo,google,mojeek,ecosia,yahoo,startpage
      - key: WEB_SEARCH_MAX_PROVIDERS
        value: "6"
      - key: WEB_SEARCH_CONCURRENCY
        value: "6"
      - key: WEB_SEARCH_EARLY_RESULT_THRESHOLD
        value: "40"
      - key: MONGODB_DB
        value: veyra
      - key: MONGODB_MAX_POOL_SIZE
        value: "2"
      - key: MONGODB_SHARED_CACHE
        value: "true"
      # Safe warm-up cap: media is never downloaded by the warm phase.
      - key: PROXY_WARM_MAX_BINARY_BYTES
        value: "786432"
           # 8.17.2 browser stability guardrails (keep browser/crawler contention bounded).
      - key: CRAWLER_PAGE_HARD_MS
        value: "5000"
      - key: PROXY_WARM_HARD_MS
        value: "3500"
      - key: BROWSER_NAVIGATION_TIMEOUT_MS
        value: "15000"
      - key: BROWSER_PAGE_TIMEOUT_MS
        value: "10000"
      - key: MAX_BROWSER_PAGES
        value: "1"
      # Optional model access is supplied in the Render dashboard; the official
      # OpenAI API base is used automatically unless OPENAI_API_BASE is set.
      - key: OPENAI_API_KEY
        sync: false
      - key: BROWSER_MAX_ACTIVE_FETCHES
        value: "4"
      - key: MONGODB_CACHE_BODY_MAX_BYTES
        value: "786432"
      # Let users complete site-owned security checks in the real Chromium fallback.
      - key: CHALLENGE_AUTO_HANDOFF
        value: "true"
      - key: BROWSER_EVICT_MIN_IDLE_MS
        value: "15000"
